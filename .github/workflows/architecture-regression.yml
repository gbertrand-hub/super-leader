name: Super Leader Architecture Regression

on:
  workflow_dispatch:
  push:
    branches:
      - audit/architecture-stability-v4-10-141
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    name: Structural checks and architecture regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse PowerShell preproduction script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/preproduction/Export-SchemaOnly.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell syntax PASS'
      - name: Check architecture
        run: node scripts/audit-architecture.mjs
      - name: Run schema drift report (non-blocking known QA divergence)
        run: npm run audit:schema-drift
      - name: Run full stability contract suite
        run: npm run test:stability
