name: Super Leader Architecture Regression

on:
  workflow_dispatch:
  push:
    branches:
      - audit/architecture-stability-v4-10-141
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    name: Structural checks and architecture regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse PowerShell preproduction script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          @(
            'scripts/preproduction/Export-SchemaOnly.ps1',
            'scripts/preproduction/Test-PrivateSchemaExport.ps1',
            'scripts/preproduction/Initialize-LocalLab.ps1',
            'scripts/preproduction/Verify-LocalLab.ps1',
            'scripts/preproduction/Start-PrivateDatabase.ps1',
            'scripts/preproduction/Inspect-PrivateDatabase.ps1',
            'scripts/preproduction/Scan-PrivateSchemaRisks.ps1',
            'scripts/preproduction/Guard-PrivateDatabasePort.ps1',
            'scripts/preproduction/Audit-PrivilegedSchema.ps1',
            'scripts/preproduction/Check-DevelopmentRestart.ps1'
          ) | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $_),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host ('PowerShell syntax PASS: ' + $_)
          }

      - name: Self-test offline privileged-function scanner
        shell: pwsh
        run: ./scripts/preproduction/Audit-PrivilegedSchema.ps1 -SelfTest

      - name: Self-test B6 native Git command forwarding
        shell: pwsh
        run: ./scripts/preproduction/Check-DevelopmentRestart.ps1 -SelfTest

      - name: Compile isolated Canton demo TSX (syntax only)
        run: npx --yes esbuild@0.25.12 src/app/canton-demo/simulator.tsx --bundle --platform=browser --external:react --outfile=/tmp/canton-demo-check.js

      - name: Compile Canton real staff view (syntax only)
        run: npx --yes esbuild@0.25.12 src/app/dashboard/canton-visitors/page.tsx --outfile=/tmp/canton-real-page-check.js

      - name: Check architecture
        run: node scripts/audit-architecture.mjs
      - name: Run schema drift report (non-blocking known QA divergence)
        run: npm run audit:schema-drift
      - name: Run full stability contract suite
        run: npm run test:stability
